[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-runner"
version = "0.1.0"
description = "Audit-friendly policy-gated executor for structured agent plans"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
guardrail-runner = "guardrail.cli:main"

[tool.setuptools.packages.find]
include = ["guardrail*"]
